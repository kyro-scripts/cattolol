<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CattoLoL - Unblocked Games Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      height: 60vh;
      min-height: 350px;
      overflow: hidden;
    }
    .hero img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
    }

    /* ── FEATURE CARDS ── */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    .feature-card {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .feature-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .feature-card:hover img { transform: scale(1.05); }
    .feature-card .card-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.08);
      transition: background 0.3s;
    }
    .feature-card:hover .card-overlay { background: rgba(0,0,0,0.18); }

    /* ── LINKS SECTION ── */
    .links-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }
    .links-section h2 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      font-style: italic;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .links-section .subtitle {
      text-align: center;
      color: #777;
      font-size: 0.85rem;
      margin-bottom: 2.5rem;
    }
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 0.75rem;
      padding: 1rem 1.5rem;
      text-decoration: none;
      color: #fff;
      transition: border-color 0.25s, background 0.25s, color 0.25s;
    }
    .link-card:hover {
      border-color: #d97706;
      background: rgba(217,119,6,0.08);
      color: #fbbf24;
    }
    .link-card span {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .link-card svg {
      flex-shrink: 0;
      width: 18px; height: 18px;
      stroke: #555;
      transition: stroke 0.25s;
    }
    .link-card:hover svg { stroke: #fbbf24; }

    footer {
      text-align: center;
      padding: 2rem;
      color: #444;
      font-size: 0.8rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- ======================================================
       HERO — replace "images/1.png" with your hero image filename
       ====================================================== -->
  <div class="hero">
    <img src="https://github.com/kyro-scripts/cattolol/blob/main/1.png?raw=true" alt="CattoLoL" />
    <div class="hero-overlay"></div>
  </div>

  <!-- ======================================================
       FEATURE CARDS — replace image filenames as needed
       images/4.png = 60+ Games card
       images/5.png = Daily Updates card
       images/7.png = Always Unblocked card
       ====================================================== -->
  <div class="features">
    <div class="feature-card">
      <img src="https://github.com/kyro-scripts/cattolol/blob/main/4.png?raw=true" alt="60+ Games" />
      <div class="card-overlay"></div>
    </div>
    <div class="feature-card">
      <img src="https://github.com/kyro-scripts/cattolol/blob/main/5.png?raw=true" alt="Daily Updates" />
      <div class="card-overlay"></div>
    </div>
    <div class="feature-card">
      <img src="https://github.com/kyro-scripts/cattolol/blob/main/7.png?raw=true" alt="Always Unblocked" />
      <div class="card-overlay"></div>
    </div>
  </div>

        <span>Mirror 2</span>
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6m0 0v6m0-6L10 14"/></svg>

</body>
</html>
